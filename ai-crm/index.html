<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="고객관리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121212">
<title>AI 고객관리 자동화</title>
<style>
/* 다크 몰입형 테마 — 근흑색 표면 + 기능적 녹색 포인트 + 알약형 버튼 */
:root{
  --bg:#121212;--card:#181818;--surface:#1f1f1f;--raised:#252525;
  --ink:#ffffff;--muted:#b3b3b3;--soft:#cbcbcb;--line:rgba(255,255,255,.08);--outline:#7c7c7c;
  --green:#1ed760;--green-d:#1ed760;--green-l:rgba(30,215,96,.14);
  --gold:#ffa42b;--gold-l:rgba(255,164,43,.14);
  --red:#f3727f;--red-l:rgba(243,114,127,.14);--amber:#ffa42b;--amber-l:rgba(255,164,43,.14);
  --blue:#539df5;--blue-l:rgba(83,157,245,.14);--gray-l:#1f1f1f;
  --pill:9999px;--shadow:rgba(0,0,0,.3) 0 8px 8px;--shadow-heavy:rgba(0,0,0,.5) 0 8px 24px;
  --inset:rgb(18,18,18) 0 1px 0,rgb(124,124,124) 0 0 0 1px inset;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-text-size-adjust:100%}
a{color:var(--ink)}
.banner{position:sticky;top:0;z-index:30;background:rgba(18,18,18,.96);backdrop-filter:blur(8px);color:var(--muted);box-shadow:0 1px 0 var(--line);font-size:13px;padding:8px 16px;text-align:center;font-weight:700;word-break:keep-all}
.banner small{display:block;font-weight:400}
main{max-width:600px;margin:0 auto;padding:12px 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700;margin:0;flex:1;min-width:0;word-break:break-word;letter-spacing:-.01em}
.top .sub{width:100%;color:var(--muted);font-size:14px;margin-top:-4px}
.back{color:var(--muted);text-decoration:none;font-weight:700;padding:8px 4px;min-height:44px;display:inline-flex;align-items:center}
.back:hover{color:var(--ink)}
.brand{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.12em}
.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:middle}
.card{background:var(--card);border-radius:8px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:18px;font-weight:600;line-height:1.3}
h2.sec{font-size:18px;font-weight:700;color:var(--ink);margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2.sec .cnt{background:var(--surface);color:var(--muted);border-radius:var(--pill);padding:1px 9px;font-size:12px}
h2.sec.red{color:var(--red)}
.btn{appearance:none;border:0;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--outline);font:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;border-radius:var(--pill);min-height:48px;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;word-break:keep-all;transition:transform .1s,background .15s}
.btn:hover{background:var(--raised);box-shadow:inset 0 0 0 1px var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green);color:#000;box-shadow:none}
.btn.primary:hover{background:#3be477}
.btn.gold{background:#eeeeee;color:#181818;box-shadow:none}
.btn.gold:hover{background:#fff}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.btn.danger:hover{background:var(--red-l)}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;padding:6px 16px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{flex-direction:column;gap:2px;font-size:14px;padding:10px 6px;border-radius:16px}
.badge{display:inline-block;font-size:12px;font-weight:700;line-height:1.5;padding:2px 10px;border-radius:var(--pill);white-space:nowrap;vertical-align:middle}
.badge.green{background:var(--green-l);color:var(--green)}
.badge.red{background:var(--red-l);color:var(--red)}
.badge.amber{background:var(--amber-l);color:var(--amber)}
.badge.blue{background:var(--blue-l);color:var(--blue)}
.badge.gray{background:var(--surface);color:var(--muted)}
.badge.stage{background:var(--surface);color:var(--ink)}
.badge.sample{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--outline)}
.item{display:block;background:var(--card);border-radius:8px;padding:14px 16px;margin-bottom:8px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:background .15s}
a.item:hover,a.item:active{background:var(--raised)}
.item.late{box-shadow:inset 4px 0 0 var(--red),var(--shadow)}
.item.done .item-title,.item.cancelled .item-title{text-decoration:line-through;color:var(--muted)}
.item-title{font-weight:700;word-break:break-word}
.meta{font-size:14px;color:var(--muted);margin-top:4px;word-break:break-word}
.meta a{color:var(--soft);font-weight:700}
.excerpt{font-size:14px;margin-top:6px;word-break:break-word;color:var(--soft)}
.why{font-size:12px;color:var(--soft);font-weight:700;margin-top:4px}
.late-t{color:var(--red);font-weight:700}
.row{display:flex;align-items:center}
.between{justify-content:space-between;align-items:flex-start;gap:10px}
.gap{gap:8px}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.muted{color:var(--muted)}.small{font-size:13px}
details.fold{background:var(--card);border-radius:8px;padding:0 16px;margin:0 0 12px;box-shadow:var(--shadow)}
details.fold>summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:54px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"펼치기 ▾";font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--surface);padding:3px 10px;border-radius:var(--pill)}
details.fold[open]>summary::after{content:"접기 ▴"}
details.fold[open]{padding-bottom:14px}
.fld{margin:0 0 14px}
.fld label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}
input,select,textarea{width:100%;max-width:100%;font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:8px;background:var(--surface);color:var(--ink);box-shadow:var(--inset);min-height:48px}
input::placeholder,textarea::placeholder{color:#7c7c7c}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;box-shadow:none;accent-color:var(--green)}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
input[type=search],.search input{border-radius:var(--pill);padding-left:20px}
.req{color:var(--red);font-size:12px;margin-left:4px}
.opt{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.phase{box-shadow:inset 4px 0 0 var(--green),var(--shadow)}
.phase.prep{box-shadow:inset 4px 0 0 var(--blue),var(--shadow)}
.phase-label{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:var(--pill);margin-bottom:8px}
.phase-label.prep{background:var(--blue-l);color:var(--blue)}
.phase-label.after{background:var(--green-l);color:var(--green)}
.prow{border:1px dashed #4d4d4d;border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.prow .fld{margin-bottom:8px}
.kv{margin:0}
.kv dt{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px;letter-spacing:.04em}
.kv dt:first-child{margin-top:0}
.kv dd{margin:3px 0 0;word-break:break-word}
.none{color:#7c7c7c;font-style:normal}
.src{display:inline-block;font-size:12px;color:var(--muted);font-weight:700;margin-left:4px;text-decoration:underline;white-space:nowrap}
.src:hover{color:var(--ink)}
.bline{padding:10px 0;border-bottom:1px solid var(--line);word-break:break-word}
.bline:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border-radius:8px;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:16px;color:var(--ink)}
.note{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:12px;word-break:keep-all}
.note.gold{background:var(--gold-l);color:var(--soft);box-shadow:inset 4px 0 0 var(--gold)}
.note.red{background:var(--red-l);color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.note.green{background:var(--green-l);color:var(--soft);box-shadow:inset 4px 0 0 var(--green)}
.note.gray{background:var(--surface);color:var(--muted)}
.note button{margin-top:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs a{flex:0 0 auto;padding:8px 16px;border-radius:var(--pill);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:400;font-size:14px;min-height:40px;display:inline-flex;align-items:center}
.tabs a.on{background:var(--ink);color:#000;font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:12px 14px;background:var(--card);border-radius:8px;margin-bottom:8px}
.chip{display:inline-block;background:var(--surface);color:var(--soft);font-size:12px;padding:2px 10px;border-radius:var(--pill);margin:2px 4px 2px 0}
.search{margin-bottom:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;z-index:40;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shadow-heavy)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:400}
.nav a.on{color:var(--ink);font-weight:700}
.nav a.on svg{stroke:var(--green)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));margin:0 auto;max-width:520px;padding:14px 20px;border-radius:var(--pill);font-weight:700;font-size:14px;text-align:center;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;z-index:80;box-shadow:var(--shadow-heavy)}
.toast.show{opacity:1;transform:none}
.toast.ok{background:#eeeeee;color:#000}
.toast.err{background:var(--red);color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-heavy)}
.sheet h2{margin:0 0 12px;font-size:20px;font-weight:700}
.sheet .x{float:right}
.pick{max-height:45vh;overflow:auto;margin-bottom:12px}
.pick-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--surface);border-radius:8px;margin-bottom:6px;text-decoration:none;color:inherit;font-weight:700;min-height:52px}
.pick-item:hover{background:var(--raised)}
.draft-state{min-height:20px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos figure{margin:0;background:var(--surface);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:8px}
.photos figure img{border-radius:0}
.photos figcaption{font-size:12px;color:var(--muted);padding:4px 6px;min-height:20px}
.photos figure .btn{margin:0 6px 6px;min-height:34px}
.photo-box{margin-bottom:8px}
@media (min-width:600px){.top h1{font-size:26px}}
</style>
</head>
<body>
<div class="banner" id="banner">이 기기의 브라우저에만 저장됩니다<small id="banner-sub">정기적으로 ‘더보기 → 백업 내보내기’를 해 주세요</small></div>
<main id="view" aria-live="polite"></main>
<nav class="nav" aria-label="주요 메뉴"><div class="nav-in">
  <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>오늘</a>
  <a href="#/people" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>사람</a>
  <a href="#/meetings" data-tab="meetings"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>만남</a>
  <a href="#/promises" data-tab="promises"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>약속</a>
  <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>더보기</a>
</div></nav>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="modal-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="assertive"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ===== 상수 ===== */
const KEY = 'meetcode_demo_v1', DKEY = 'meetcode_draft:';
const STAGES = ['첫 만남','알아가는 중','친분','신뢰','관심·경험','협업','장기 파트너'];
const CSTATUS = {active:'연락 가능', hold:'연락 보류', stop:'연락 중단'};
const PSTATUS = {open:'진행 중', done:'완료', cancelled:'취소'};
const SCHED = {agreed:'합의됨', planned:'내가 계획함', undecided:'미정'};
const WD = '일월화수목금토';

/* ===== 저장소 ===== */
let db, storageOk = true;
function emptyDb(){ return {version:1, settings:{appName:'AI 고객관리 자동화'}, customers:[], meetings:[], promises:[], plans:[], followups:[], products:[], productEvents:[], messages:[]}; }
function load(){
  try { const raw = localStorage.getItem(KEY); db = raw ? JSON.parse(raw) : emptyDb(); }
  catch(e){ storageOk = false; db = emptyDb(); }
  const e = emptyDb(); for (const k in e) if (db[k] == null) db[k] = e[k];
  if (!db.settings.appName || db.settings.appName === 'MEET CODE') db.settings.appName = e.settings.appName;  // 예전 기본 이름은 새 이름으로
}
function persist(){
  if (window.__mcFailNextSave){ window.__mcFailNextSave = false; throw new Error('테스트용 저장 실패'); }
  localStorage.setItem(KEY, JSON.stringify(db));
}
// 변경을 한 번에 적용하고, 저장에 실패하면 메모리 상태도 되돌린다.
function commit(fn){
  const snap = JSON.stringify(db);
  try { fn(db); persist(); return true; }
  catch(err){
    db = JSON.parse(snap); console.error(err);
    toast('저장하지 못했습니다. 입력한 내용은 그대로 남아 있으니 다시 시도해 주세요.', 'err');
    return false;
  }
}

/* ===== 날짜 (한국 시간) ===== */
const kstFmt = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'});
function today(){ return kstFmt.format(new Date()); }
function addDays(s, n){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function fd(s){ if (!s) return ''; const d = new Date(s + 'T00:00:00Z'); return `${d.getUTCFullYear()}.${d.getUTCMonth()+1}.${d.getUTCDate()} (${WD[d.getUTCDay()]})`; }
function fds(s){ if (!s) return ''; const d = new Date(s + 'T00:00:00Z'); return `${d.getUTCMonth()+1}.${d.getUTCDate()}`; }
function rel(s){
  if (!s) return '';
  const diff = Math.round((Date.parse(s) - Date.parse(today())) / 864e5);
  if (diff === 0) return '오늘'; if (diff === 1) return '내일'; if (diff === -1) return '어제';
  return diff > 0 ? `${diff}일 후` : `${-diff}일 지남`;
}

/* ===== 도우미 ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl(s){ return esc(s).replace(/\n/g, '<br>'); }
function cut(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
const NONE = '<span class="none">기록 없음</span>';
const cust = id => db.customers.find(c => c.id === id);
const byDate = (a, b) => ((a.date||'') + (a.time||'')).localeCompare((b.date||'') + (b.time||''));
function doneMeetings(cid){ return db.meetings.filter(m => m.customerId === cid && m.status === 'done').sort(byDate); }
function stats(cid){ const ms = doneMeetings(cid); return {count: ms.length, last: ms.length ? ms[ms.length-1].date : null}; }
function meetingNo(m){ return m.status === 'done' ? doneMeetings(m.customerId).findIndex(x => x.id === m.id) + 1 : null; }
function trimAll(o){ if (typeof o === 'string') return o.trim(); if (Array.isArray(o)) return o.map(trimAll); if (o && typeof o === 'object'){ const r = {}; for (const k in o) r[k] = trimAll(o[k]); return r; } return o; }
function srcLink(m, label){ return m ? `<a class="src" href="#/meeting/${m.id}">근거: ${fds(m.date)} ${label || '만남'}</a>` : ''; }

function toast(msg, type = 'ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast ' + type, type === 'err' ? 6000 : 2600);
}
function openModal(html){ $('#modal-body').innerHTML = html; $('#modal').hidden = false; const f = $('#modal-body input:not([type=hidden]),#modal-body select,#modal-body textarea'); }
function closeModal(){ $('#modal').hidden = true; $('#modal-body').innerHTML = ''; }

/* ===== 배지 ===== */
function badgeStage(n){ return `<span class="badge stage">${n}단계 · ${STAGES[n-1] || ''}</span>`; }
function badgeCS(s){ return (!s || s === 'active') ? '' : `<span class="badge ${s === 'stop' ? 'red' : 'amber'}">${CSTATUS[s]}</span>`; }
function badgeP(st){ const cls = {open:'blue', done:'green', cancelled:'gray'}[st]; return `<span class="badge ${cls}">${st === 'done' ? '✓ ' : ''}${PSTATUS[st]}</span>`; }
function badgeSched(s){ const cls = {agreed:'green', planned:'blue', undecided:'gray'}[s] || 'gray'; return `<span class="badge ${cls}">${SCHED[s] || '미정'}</span>`; }
function badgeSample(x){ return x && x.sample ? ' <span class="badge sample">샘플</span>' : ''; }
function dueTxt(p){
  if (!p.dueDate) return '기한 없음';
  const late = p.status === 'open' && p.dueDate < today();
  return `<span class="${late ? 'late-t' : ''}">기한 ${fd(p.dueDate)} · ${rel(p.dueDate)}</span>`;
}

/* ===== 폼 직렬화 & 임시저장 ===== */
function formObj(f){
  const o = {};
  for (const el of f.elements){
    if (!el.name) continue;
    const path = el.name.split('.'); let cur = o;
    for (let i = 0; i < path.length - 1; i++){
      if (cur[path[i]] == null) cur[path[i]] = /^\d+$/.test(path[i+1]) ? [] : {};
      cur = cur[path[i]];
    }
    cur[path[path.length-1]] = el.type === 'checkbox' ? el.checked : el.value;
  }
  return o;
}

/* ===== 만남 준비·기록 폼 ===== */
function meetingToState(m){
  const f = db.followups.find(x => x.meetingId === m.id);
  return {id: m.id, customerId: m.customerId, date: m.date, time: m.time, place: m.place, purpose: m.purpose,
    prep: {...(m.prep || {})}, record: {...(m.record || {}), detail: {...((m.record || {}).detail || {})}}, style: {...(m.style || {})},
    promises: db.promises.filter(p => p.meetingId === m.id).map(p => ({id: p.id, content: p.content, dueDate: p.dueDate})),
    plans: db.plans.filter(p => p.meetingId === m.id).map(p => ({id: p.id, content: p.content})),
    next: f ? {followupId: f.id, action: f.action, date: f.date, scheduleStatus: f.scheduleStatus} : {followupId: uid('f'), scheduleStatus: 'planned'}};
}
function normState(s){
  s.prep = s.prep || {}; s.record = s.record || {}; s.record.detail = s.record.detail || {}; s.style = s.style || {};
  s.promises = (s.promises || []).filter(Boolean); s.plans = (s.plans || []).filter(Boolean);
  s.next = s.next || {}; if (!s.next.followupId) s.next.followupId = uid('f');
  return s;
}
function vMeetingForm(id, q){
  const m = id ? db.meetings.find(x => x.id === id) : null; if (id && !m) return notFound('#/meetings');
  const mode = q.get('mode') === 'record' ? 'record' : 'prep';
  const cid = m ? m.customerId : q.get('c'), c = cust(cid);
  if (!c) return `<div class="card"><h3>먼저 사람을 선택하세요</h3><button class="btn primary" data-act="pick" data-mode="${mode}">사람 선택</button></div>`;
  const key = `meeting:${id || 'new:' + cid}:${mode}`, dr = getDraft(key);
  const s = normState(dr ? dr.data : m ? meetingToState(m) : {id: uid('m'), customerId: cid, date: today(), next: {scheduleStatus: 'planned'}});
  if (mode === 'record' && !s.promises.length) s.promises.push({id: uid('p'), content: '', dueDate: ''});
  if (mode === 'record' && !s.plans.length) s.plans.push({id: uid('pl'), content: '', });
  const p = s.prep, r = s.record, d = r.detail;

/* ===== 약속 목록 ===== */
function vPromises(q){
  const tab = q.get('tab') || 'open';
  let list = db.promises.filter(p => cust(p.customerId));
  if (tab !== 'all') list = list.filter(p => p.status === tab);
  list.sort((a, b) => tab === 'open' ? (a.dueDate || '9').localeCompare(b.dueDate || '9') : (b.doneDate || b.dueDate || '').localeCompare(a.doneDate || a.dueDate || ''));
  const tabA = (k, l) => `<a href="#/promises?tab=${k}" class="${tab === k ? 'on' : ''}">${l}</a>`;
  return `<header class="top"><h1>내 약속</h1><button class="btn primary sm" data-act="promise-new">＋ 약속 추가</button></header>
  <p class="muted small">내가 상대에게 하기로 한 일입니다. 상대가 말한 계획은 고객 상세에서 따로 봅니다.</p>

  ${list.map(p => pCard(p)).join('') || '<div class="empty">해당하는 약속이 없습니다.</div>'}`;
}

function avgScore(st){
  const v = STYLE_SCORES.map(([k]) => Number((st || {})[k])).filter(n => n > 0);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null;
}
function styleFields(st, withAfter){
  st = st || {};
  return `<p class="hint">모두 선택 입력입니다. 상대의 외모로 성격·재력·적합성을 추정하지 않으며, 옷차림이 구매나 신뢰를 만들었다고 단정하지 않습니다.</p>

    ${fld('만남 전 자신감 (1~5)', 'style.confidenceBefore', st.confidenceBefore || '', {options: SCORE_OPTS, noOpt: true})}
    ${withAfter ? `<p class="hint mt16"><b>만남 후 자기평가 (1~5)</b> · 나의 주관적 평가이며 객관적 점수가 아닙니다.</p>
      <div class="grid2">${STYLE_SCORES.map(([k, l]) => fld(l, `style.${k}`, st[k] || '', {options: SCORE_OPTS, noOpt: true})).join('')}</div>
      ${fld('다시 입을지', 'style.wearAgain', st.wearAgain || '', {options: WEAR_AGAIN, noOpt: true})}
      ${fld('다음에 바꿀 한 가지', 'style.changeOne', st.changeOne, {noOpt: true})}` : ''}
    <a class="btn sm ghost" href="#/styles">지난 스타일 참고하기</a>`;
}
function styleView(st){
  st = st || {};
  const rows = STYLE_BEFORE.filter(([k]) => st[k]).map(([k, l]) => `<dt>${l}</dt><dd>${esc(st[k])}</dd>`);
  const scores = STYLE_SCORES.filter(([k]) => st[k]).map(([k, l]) => `${l} ${esc(st[k])}`).join(' · ');
  if (!rows.length && !scores && !st.reason && !st.changeOne) return '';
  const avg = avgScore(st);

// 사진 — 용량이 커서 기록(localStorage)과 분리해 브라우저 사진 저장소(IndexedDB)에 보관
let photoDbP = null;
function photoDb(){
  return photoDbP || (photoDbP = new Promise((ok, bad) => {
    const r = indexedDB.open('meetcode_photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath: 'id'});
    r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
  }));
}
async function photoTx(mode, fn){
  const d = await photoDb();
  return new Promise((ok, bad) => {
    const tx = d.transaction('photos', mode), req = fn(tx.objectStore('photos'));
    tx.oncomplete = () => ok(req && req.result); tx.onerror = () => bad(tx.error);
  });
}
async function allPhotos(){ return (await photoTx('readonly', st => st.getAll())) || []; }
async function deletePhotosWhere(pred){
  try { const ids = (await allPhotos()).filter(pred).map(p => p.id); if (ids.length) await photoTx('readwrite', st => { ids.forEach(id => st.delete(id)); }); } catch(e){}
}
function photoBox(ctx, note){
  return `<div class="photo-box" data-ctx='${esc(JSON.stringify(ctx))}'>${note ? `<p class="hint">${note}</p>` : ''}
    <div class="photos" data-photo-list><span class="muted small">사진 불러오는 중…</span></div>
    <div class="row gap mt8"><input class="grow" data-photo-caption placeholder="설명 (선택)"><label class="btn sm">사진 추가<input type="file" accept="image/*" data-photo-input hidden></label></div></div>`;
}
async function hydratePhotos(){
  const boxes = $$('.photo-box'), strips = $$('[data-outfit-of]');
  if (!boxes.length && !strips.length) return;
  let list;
  try { list = await allPhotos(); }
  catch(e){ boxes.forEach(b => { $('[data-photo-list]', b).innerHTML = '<span class="muted small">이 브라우저에서는 사진을 저장할 수 없습니다.</span>'; }); return; }
  list.sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  boxes.forEach(b => {
    const ctx = JSON.parse(b.dataset.ctx);
    const mine = list.filter(p => (ctx.meetingId ? p.meetingId === ctx.meetingId : p.customerId === ctx.customerId && !p.meetingId) && p.kind === ctx.kind);
    $('[data-photo-list]', b).innerHTML = mine.map(p => `<figure><img src="${p.data}" alt="${esc(p.caption || '사진')}"><figcaption>${esc(p.caption || '')}</figcaption>
      <button class="btn sm danger" data-act="photo-del" data-id="${p.id}">삭제</button></figure>`).join('') || '<span class="muted small">사진이 없습니다.</span>';
  });
  strips.forEach(s => { s.innerHTML = list.filter(p => p.meetingId === s.dataset.outfitOf && p.kind === 'outfit').map(p => `<img src="${p.data}" alt="옷차림 사진">`).join(''); });
}
function readAsDataURL(file){ return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(file); }); }
// 화면 크기에 맞게 줄이고 JPG로 다시 저장 → 용량 절약, 위치정보(EXIF) 제거
async function resizeImage(file, max = 1280){
  const img = new Image(); img.src = await readAsDataURL(file); await img.decode();
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = Object.assign(document.createElement('canvas'), {width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k)});
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.82);
}
async function uploadPhoto(input){
  const file = input.files[0]; if (!file) return;
  const box = input.closest('.photo-box'), ctx = JSON.parse(box.dataset.ctx);
  try {
    toast('사진을 저장하는 중…');
    const data = await resizeImage(file);
    const customerId = ctx.customerId || (db.meetings.find(m => m.id === ctx.meetingId) || {}).customerId;
    await photoTx('readwrite', st => st.put({id: uid('ph'), customerId, meetingId: ctx.meetingId || null, kind: ctx.kind,
      caption: $('[data-photo-caption]', box).value.trim(), data, createdAt: new Date().toISOString()}));
    toast('사진을 추가했습니다.'); hydratePhotos();
  } catch(err){ console.error(err); toast('사진을 저장하지 못했습니다. 저장 공간을 확인해 주세요.', 'err'); }
  input.value = '';
}

// 접어 둔 영역 안에서 저장한 뒤 다시 그려도 그 영역이 열려 있게 한다

function setPromise(id, status){
  const ok = commit(d => { const p = d.promises.find(x => x.id === id); if (!p) return; p.status = status; p.doneDate = status === 'done' ? (p.doneDate || today()) : null; });
  if (ok){ toast(status === 'done' ? '약속을 완료로 표시했습니다. 모든 화면에 반영됩니다.' : '진행 중으로 되돌렸습니다.'); rerender(); }
}
function setFollowup(id, status){
  const ok = commit(d => { const f = d.followups.find(x => x.id === id); if (!f) return; f.status = status; f.doneDate = status === 'done' ? today() : null; });
  if (ok){ toast(status === 'done' ? '연락 완료로 표시했습니다.' : status === 'cancelled' ? '연락 일정을 취소했습니다.' : '다시 열었습니다.'); rerender(); }
}

/* ===== 저장 처리 ===== */
const submits = {
  customer(f){
    const d = trimAll(formObj(f));
    if (!d.name){ toast('이름 또는 별칭을 입력해 주세요.', 'err'); f.elements.name.focus(); return; }
    lock(f);
    const t = today(), now = new Date().toISOString();
    const ok = commit(db => {
      let c = db.customers.find(x => x.id === d.id);
      if (!c){ const st = +d.stage || 1; c = {id: d.id, createdAt: now, stage: st, stageHistory: [{date: t, from: null, to: st, reason: '처음 등록'}], contactLog: [], contactStatus: 'active'}; db.customers.push(c); }
      const prev = c.contactStatus, next = d.contactStatus || c.contactStatus || 'active';
      Object.assign(c, {name: d.name, source: d.source || '', tags: (d.tags || '').split(',').map(x => x.trim()).filter(Boolean),
        interests: d.interests || '', contact: d.contact || '', job: d.job || '', contactPref: d.contactPref || '',
        contactStatus: next, statusReason: d.statusReason || '', memo: d.memo || '', updatedAt: now});
      if (prev !== next) c.contactLog.push({date: t, status: next, reason: c.statusReason});
    });
    if (ok){ f.dataset.saved = '1'; clearDraft(f.dataset.draft); toast('저장했습니다.'); go('/person/' + d.id); } else unlock(f);
  },
  meeting(f){
    const mode = f.dataset.mode, d = normState(trimAll(formObj(f)));
    if (!d.date){ toast('만남 날짜를 입력해 주세요.', 'err'); f.elements.date.focus(); return; }
    lock(f);
    const now = new Date().toISOString();
    const ok = commit(db => {
      const c = db.customers.find(x => x.id === d.customerId); if (!c) throw new Error('고객 없음');
      let m = db.meetings.find(x => x.id === d.id);
      if (!m){ m = {id: d.id, customerId: d.customerId, createdAt: now, status: 'planned', stageAtMeeting: c.stage}; db.meetings.push(m); }
      Object.assign(m, {date: d.date, time: d.time || '', place: d.place || '', purpose: d.purpose || '', prep: d.prep, updatedAt: now});
      m.style = cleanObj({...(m.style || {}), ...d.style});
      if (mode !== 'record') return;
      m.record = d.record; m.status = 'done'; m.recordedAt = m.recordedAt || now;
      // 내 약속: 행마다 미리 만든 id로 upsert → 중복 저장돼도 한 건만 남는다.
      const keepP = new Set();
      for (const r of d.promises.filter(x => x.content)){
        keepP.add(r.id);
        let p = db.promises.find(x => x.id === r.id);
        if (!p){ p = {id: r.id, customerId: m.customerId, meetingId: m.id, createdDate: m.date, status: 'open', doneDate: null}; db.promises.push(p); }
        p.content = r.content; p.dueDate = r.dueDate || '';
      }
      db.promises = db.promises.filter(x => x.meetingId !== m.id || keepP.has(x.id));
      const keepPl = new Set();
      for (const r of d.plans.filter(x => x.content)){
        keepPl.add(r.id);
        let p = db.plans.find(x => x.id === r.id);
        if (!p){ p = {id: r.id, customerId: m.customerId, meetingId: m.id}; db.plans.push(p); }
        p.content = r.content; p.date = m.date;
      }
      db.plans = db.plans.filter(x => x.meetingId !== m.id || keepPl.has(x.id));
      const n = d.next;
      if (n.action || n.date){
        let fu = db.followups.find(x => x.id === n.followupId);
        if (!fu){ fu = {id: n.followupId, customerId: m.customerId, meetingId: m.id, status: 'open'}; db.followups.push(fu); }
        Object.assign(fu, {action: n.action || '', date: n.date || '', scheduleStatus: n.scheduleStatus || 'undecided'});
      } else db.followups = db.followups.filter(x => x.id !== n.followupId);
      const to = +d.stageAfter;
      if (to && to !== c.stage){
        (c.stageHistory = c.stageHistory || []).push({date: m.date, from: c.stage, to, reason: d.stageReason || '', meetingId: m.id});
        c.stage = to; m.stageAfter = to; m.stageReason = d.stageReason || '';
      }
    });
    if (ok){ f.dataset.saved = '1'; clearDraft(f.dataset.draft); toast(mode === 'record' ? '만남 기록을 저장했습니다.' : '만남 준비를 저장했습니다.'); go('/meeting/' + d.id); }
    else { unlock(f); saveDraft(f); }
  },
  promise(f){
    const d = trimAll(formObj(f));
    if (!d.customerId){ toast('연결 고객을 선택해 주세요.', 'err'); return; }
    if (!d.content){ toast('약속 내용을 입력해 주세요.', 'err'); return; }
    lock(f);
    const ok = commit(db => {
      let p = db.promises.find(x => x.id === d.id);
      if (!p){ p = {id: d.id, createdDate: today(), status: 'open', doneDate: null}; db.promises.push(p); }
      Object.assign(p, {customerId: d.customerId, meetingId: d.meetingId || null, content: d.content, dueDate: d.dueDate || ''});
      if (d.status && d.status !== p.status){ p.status = d.status; p.doneDate = d.status === 'done' ? today() : null; }
    });
    if (ok){ toast('약속을 저장했습니다.'); closeModal(); rerender(); } else unlock(f);
  },
  stage(f){
    const d = trimAll(formObj(f)), c = cust(d.customerId), to = +d.to;
    if (to === c.stage){ toast('현재 단계와 같습니다.', 'err'); return; }
    if (!d.reason){ toast('변경 근거를 짧게 남겨 주세요.', 'err'); return; }
    lock(f);
    if (commit(db => { const x = db.customers.find(y => y.id === c.id); (x.stageHistory = x.stageHistory || []).push({date: d.date || today(), from: x.stage, to, reason: d.reason}); x.stage = to; })){ toast('관계 단계를 변경했습니다.'); closeModal(); rerender(); } else unlock(f);
  },
  settings(f){
    const name = f.elements.appName.value.trim();
    if (!name){ toast('앱 이름을 입력해 주세요.', 'err'); return; }
    if (commit(db => { db.settings.appName = name; })){ toast('앱 이름을 저장했습니다.'); rerender(); }
  },
  ordersite(f){
    const url = f.elements.url.value.trim();
    if (url && !/^https?:\/\//.test(url)){ toast('주소는 http:// 또는 https:// 로 시작해야 합니다.', 'err'); return; }
    if (commit(db => { db.settings.orderSiteUrl = url; })){ toast('주문 사이트 주소를 저장했습니다.'); rerender(); }
  },
  stylesearch(f){ const v = f.elements.place.value.trim(); go('/styles' + (v ? '?place=' + encodeURIComponent(v) : '')); },
  product(f){
    const d = trimAll(formObj(f));
    if (!d.name){ toast('제품 이름을 입력해 주세요.', 'err'); return; }
    lock(f);
    const ok = commit(db => {
      let p = db.products.find(x => x.id === d.id);
      if (!p){ p = {id: d.id, createdAt: new Date().toISOString()}; db.products.push(p); }
      Object.assign(p, {name: d.name, category: d.category || '', guide: d.guide || '', source: d.source || '', checkedDate: d.checkedDate || '', note: d.note || ''});
    });
    if (ok){ toast('제품 자료를 저장했습니다.'); rerender(); } else unlock(f);
  },
  reorder(f){
    const d = formObj(f);
    if (commit(db => { db.customers.find(c => c.id === d.customerId).reorderPref = d.pref; })){ toast('저장했습니다.'); rerenderOpen('#prod-fold'); }
  },
  pevent(f){
    const d = trimAll(formObj(f)), c = cust(d.customerId), pr = db.products.find(p => p.id === d.productId);
    const name = d.productName || (pr && pr.name);
    if (!name){ toast('제품을 고르거나 이름을 입력해 주세요.', 'err'); return; }
    if (d.type === 'purchase' && d.noticeDate && c.reorderPref !== 'yes'){ toast('고객이 재구매 안내를 원한다고 기록한 경우에만 안내 날짜를 정할 수 있습니다.', 'err'); return; }
    lock(f);
    const ok = commit(db => {
      if (db.productEvents.some(e => e.id === d.id)) return;   // 중복 저장 방지
      let followupId = null;
      const plan = (d.type === 'trial' || d.type === 'start') && d.checkDate ? ['product_check', `제품 사용 경험 확인: ${name}`, d.checkDate]
        : d.type === 'purchase' && d.noticeDate ? ['reorder', `재구매 안내: ${name}`, d.noticeDate] : null;
      if (plan){
        followupId = uid('f');
        db.followups.push({id: followupId, customerId: c.id, meetingId: null, kind: plan[0], action: plan[1], date: plan[2], scheduleStatus: 'planned', status: 'open'});
      }
      db.productEvents.push({id: d.id, customerId: c.id, productId: pr ? pr.id : null, productName: name, type: d.type, date: d.date || today(),
        text: d.text || '', amount: d.type === 'purchase' ? (d.amount || '') : '', followupId, createdAt: new Date().toISOString()});
    });
    if (ok){ toast(d.checkDate || d.noticeDate ? '제품 기록과 연락 일정을 저장했습니다.' : '제품 기록을 저장했습니다.'); rerenderOpen('#prod-fold'); } else unlock(f);
  },
  message(f){
    const d = trimAll(formObj(f)), c = cust(d.customerId);
    if (!d.body){ toast('메시지 내용을 입력해 주세요.', 'err'); return; }
    if (d.status === 'scheduled' && !d.scheduledDate){ toast('보낼 날짜를 입력해 주세요.', 'err'); return; }
    if (d.status === 'scheduled' && c.contactStatus === 'stop'){ toast('연락 중단 상태인 고객에게는 발송을 예약할 수 없습니다.', 'err'); return; }
    lock(f);
    const ok = commit(db => {
      if (db.messages.some(x => x.id === d.id)) return;   // 중복 저장 방지
      db.messages.push({id: d.id, customerId: c.id, body: d.body, scheduledDate: d.scheduledDate || '', scheduledTime: d.scheduledTime || '',
        status: d.status, sentAt: null, createdAt: new Date().toISOString()});
    });
    if (ok){ toast('메시지를 저장했습니다.'); rerenderOpen('#msg-fold'); } else unlock(f);
  },
};

/* ===== 이벤트 ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (el.dataset.busy) return;               // 연속 클릭 방지
  el.dataset.busy = '1'; setTimeout(() => { delete el.dataset.busy; }, 600);
  fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault();
  if (f.dataset.busy || f.dataset.saved) return;   // 중복 저장 방지
  submits[f.dataset.form](f);
});
document.addEventListener('input', e => {
  const flt = e.target.closest('[data-filter]');
  if (flt){
    const q = flt.value.trim().toLowerCase(), box = $(flt.dataset.filter); let shown = 0;
    $$('[data-name]', box).forEach(x => { const on = x.dataset.name.includes(q); x.hidden = !on; if (on) shown++; });
    const em = $('[data-empty]', box); if (em) em.hidden = shown > 0 || !$$('[data-name]', box).length;
    return;
  }
  const f = e.target.closest('form[data-draft]');
  if (f){ clearTimeout(draftTimer); draftTimer = setTimeout(() => saveDraft(f), 400); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-photo-input]')){ uploadPhoto(e.target); return; }
  if (e.target.name === 'type' && e.target.closest('form[data-form=pevent]')){ syncEvForm(); return; }
  if (e.target.name === 'customerId' && e.target.closest('form[data-form=promise]')) $('#pm-meeting').innerHTML = meetingSelect(e.target.value, '');
  const f = e.target.closest('form[data-draft]'); if (f) saveDraft(f);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
window.addEventListener('pagehide', () => saveDraft($('form[data-draft]')));
document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft($('form[data-draft]')); });
window.addEventListener('hashchange', () => route());
window.addEventListener('storage', e => { if (e.key === KEY){ load(); rerender(); } });
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!['customers', 'meetings', 'promises'].every(k => Array.isArray(data[k]))) throw new Error('형식 오류');
    if (!confirm(`백업 파일: 사람 ${data.customers.length}명 · 만남 ${data.meetings.length}건 · 약속 ${data.promises.length}건\n지금 데이터를 이 내용으로 바꿀까요?`)) return;
    if (commit(d => { const e0 = emptyDb(); delete data.exportedAt; Object.assign(d, e0, data); })){ toast('백업에서 복원했습니다.'); go('/today'); }
  } catch(err){ toast('백업 파일을 읽을 수 없습니다. AI 고객관리 자동화에서 내보낸 JSON 파일인지 확인해 주세요.', 'err'); }
});

load();
route();
// 브라우저가 저장 공간 부족 시 데이터를 임의로 지우지 않도록 요청한다 (지원 브라우저만).
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
</script>
</body>
</html>
